# An example of application-local.yml config
spring:
  mongodb:
    # Override this if you are running MongoDB locally without Docker
    # uri: mongodb://root:some_secret_password@localhost:27017/db?authSource=admin
    uri: mongodb://root:some_secret_password@mongo:27017/db?authSource=admin

auth:
  jwt:
    secret: "your-very-long-base64-encoded-secret-here"
    expiration-time: 15m
    issuer: EveryExpense
  refresh-token:
    expiration-time: 7d

gemini:
  api-key: "your-api-key"
  model: "gemini-3.5-flash"

exchange-rates:
  api-key: "your-exchange-rate-api-key"
