spring:
  profiles:
    default: local

  application:
    name: expense

  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://root:some_secret_password@mongo:27017/}
    database: ${SPRING_MONGODB_DATABASE:db}

  data:
    mongodb:
      auto-index-creation: true

  mvc:
    problemdetails:
      enabled: true
  web:
    error:
      include-stacktrace: never

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

auth:
  jwt:
    secret: ${JWT_SECRET:very_secret_key_change_it_in_production}
    expiration-time: ${JWT_EXPIRATION:1h}
    issuer: ${JWT_ISSUER:expense-app}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-1.5-flash}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health
  health:
    mongodb:
      enabled: true