server:
  port: ${PORT:8080}

spring:
  profiles:
    default: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: expense

  data:
    mongodb:
      uri: ${MONGODB_URI:${MONGO_URL:mongodb://root:some_secret_password@mongo:27017/db}}
      auto-index-creation: true

  mvc:
    problemdetails:
      enabled: true
  web:
    error:
      include-stacktrace: never

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health
  health:
    mongodb:
      enabled: true

auth:
  jwt:
    secret: ${JWT_SECRET:your-very-long-base64-encoded-secret-here}
    expiration-time: ${JWT_EXPIRATION_TIME:15m}
    issuer: ${JWT_ISSUER:EveryExpense}
  refresh-token:
    expiration-time: ${REFRESH_TOKEN_EXPIRATION_TIME:7d}

gemini:
  api-key: ${GEMINI_API_KEY:your-api-key}
  model: ${GEMINI_MODEL:gemini-3.5-flash}

