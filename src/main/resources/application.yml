spring:
  profiles:
    default: local

  application:
    name: expense

  mongodb:
    uri: mongodb://root:some_secret_password@mongo:27017/
    database: db

  data:
    mongodb:
      auto-index-creation: true

  mvc:
    problemdetails:
      enabled: true
  web:
    error:
      include-stacktrace: never

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health
  health:
    mongodb:
      enabled: true