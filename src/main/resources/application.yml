server:
  port: ${PORT:8080}

spring:
  profiles:
    default: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: expense

  mongodb:
    uri: ${MONGODB_URI:${MONGO_URL:mongodb://root:some_secret_password@mongo:27017/db?authSource=admin}}
    auto-index-creation: true

  mvc:
    problemdetails:
      enabled: true
  web:
    error:
      include-stacktrace: never

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

auth:
  jwt:
    secret: ${JWT_SECRET:very_secret_key_change_it_in_production}
    expiration-time: ${JWT_EXPIRATION:1h}
    issuer: ${JWT_ISSUER:expense-app}
  refresh-token:
    expiration-time: ${REFRESH_TOKEN_EXPIRATION_TIME:7d}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-1.5-flash}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health
  health:
    mongodb:
      enabled: true

minio:
  url: ${MINIO_URL:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:root}
  secret-key: ${MINIO_SECRET_KEY:some_secret_password}
  bucket-name: ${MINIO_BUCKET_NAME:every-expense}
